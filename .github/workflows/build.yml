name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Build
        run: |
          make clean
          make package

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WeChatMod-build
          path: |
            .theos/obj/**/*.dylib
            packages/*.deb
          if-no-files-found: warn
