name: Build WCClown

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: macos-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $THEOS


    - name: Setup SDK
      run: |
        mkdir -p $THEOS/sdks


    - name: Build
      run: |
        export THEOS=$HOME/theos
        make package FINALPACKAGE=1


    - name: Upload Deb
      uses: actions/upload-artifact@v4
      with:
        name: WCClown-deb
        path: packages/*.deb
