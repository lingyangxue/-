name: Build WCClown dylib

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: macos-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install Theos and ldid
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV

        git clone https://github.com/ProcursusTeam/ldid.git
        cd ldid
        make
        sudo cp ldid /usr/local/bin/ldid


    - name: Build dylib
      run: |
        export THEOS=$HOME/theos

        make clean

        make DEBUG=0


    - name: Find dylib
      run: |
        mkdir -p output
        find . -name "WCClown.dylib" -exec cp {} output/WCClown.dylib \;


    - name: Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: WCClown-dylib
        path: output/WCClown.dylib
